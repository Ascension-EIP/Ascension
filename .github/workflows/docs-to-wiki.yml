############################ CONFIGURATION ####################################
name: ascension-docs-to-wiki

on:
  workflow_run:
    workflows: ["ascension-staging-to-main"]
    types:
      - completed
  workflow_dispatch:

env:
  GITHUB_ACTIONS: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
###############################################################################

############################ JOBS #############################################
jobs:

  ########################## WIKI #############################################
  update_wiki:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && github.repository == 'Ascension-EIP/Ascension' }}

    ######################## STEPS ############################################
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Generate wiki files
        run: .github/scripts/generate_wiki

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh
      - name: Set up Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5.0.4
  #############################################################################

###############################################################################