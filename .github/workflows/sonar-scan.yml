############################ CONFIGURATION ####################################
name: ascension-sonar-scan

on:
  workflow_dispatch: {}

env:
  GITHUB_ACTIONS: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
###############################################################################



############################ JOBS #############################################
jobs:
  ########################## SONARQUBE SCAN ####################################
  sonar-scan:
    runs-on: ubuntu-latest

    ######################## STEPS ############################################
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: apps/server/go.sum

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Cache moon store
        uses: actions/cache@v6
        with:
          path: .moon/cache
          key: ${{ runner.os }}-moon-sonar-${{ hashFiles('apps/server/go.sum', 'apps/ai/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-moon-sonar-

      - name: Run SonarQube analysis
        run: moon run :sonar-scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #############################################################################

###############################################################################
