############################ CONFIGURATION ####################################
name: ascension-detect-no-ci

on:
  workflow_call:
    outputs:
      skip:
        description: "Indicates whether CI checks should be skipped"
        value: ${{ jobs.detect_no_ci.outputs.skip }}

env:
  GITHUB_ACTIONS: true
###############################################################################



############################ JOBS #############################################
jobs:
  ########################## NO-CI DETECTION ##################################
  detect_no_ci:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}

    ######################## STEPS ############################################
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect no-ci prefix in commit message
        id: check
        run: |
          COMMIT_NAME=$(git log --format="%s" -1)
          echo "Commit message: $COMMIT_NAME"
          if echo "$COMMIT_NAME" | grep -qiE '^\[(no-ci|ci-no|ci no|no ci|ci-off|off-ci|ci off|off ci|ci-skip|skip-ci|ci skip|skip ci)\]'; then
            echo "::notice title=CI skip::No-CI prefix detected — skipping all checks"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
  #############################################################################

###############################################################################
