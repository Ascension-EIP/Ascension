# Project identification
sonar.projectKey=ascension
sonar.projectName=Ascension
sonar.projectVersion=1.0

# Path to the source directories
sonar.sources=apps

# Exclusions
sonar.exclusions=\
  **/*.spec.ts,**/*.test.ts,\
  **/node_modules/**,\
  **/.moon/**,\
  **/docs/**,\
  **/graphify-out/**,\
  **/test/**,**/tests/**,\
  **/venv/**,**/.venv/**,**/ai-env/**,**/env/**,\
  **/__pycache__/**,**/*.pyc,**/*.pyo,**/.pytest_cache/**,**/.cache/**,\
  apps/mobile/build/**,\
  apps/mobile/.dart_tool/**,\
  apps/mobile/.symlinks/**,\
  apps/mobile/ios/Pods/**,\
  apps/mobile/ios/build/**,\
  apps/mobile/android/.gradle/**,\
  apps/mobile/android/app/build/**,\
  apps/server/bin/**,\
  apps/server/dist/**,\
  **/*.g.dart,**/*.freezed.dart

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Coverage configuration placeholder paths
sonar.go.coverage.reportPaths=apps/server/coverage.out
sonar.python.version=3.11
sonar.python.coverage.reportPaths=apps/ai/coverage.xml

