services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ascension-minIO
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: ascension-rabbitMQ
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file: .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    build: ./apps/server/postgres
    container_name: ascension-postgreSQL
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./apps/server
    container_name: ascension-server
    profiles:
      - prod
    ports:
      - "${PORT}:8080"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgresql
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=http://minio:${MINIO_PORT}
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-worker:
    build: ./apps/ai
    container_name: aiWorker
    profiles:
      - prod
    env_file: .env
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:${POSTGRES_PORT}/${POSTGRES_DB}
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=http://minio:${MINIO_PORT}
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  sonar-db:
    image: postgres:18-alpine
    container_name: ascension-sonar-db
    profiles:
      - sonar
    environment:
      - POSTGRES_USER=${SONAR_DB_USER}
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD}
      - POSTGRES_DB=${SONAR_DB_NAME}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - ascension-sonar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:lts-community
    container_name: ascension-sonarqube
    profiles:
      - sonar
    ports:
      - "9005:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME}
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
      - SONAR_SEARCH_JAVAADDITIONALOPTS=-Dcluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - ascension-sonar-net
    depends_on:
      sonar-db:
        condition: service_healthy

volumes:
  minio_data:
  postgres_data:
  rabbitmq_data:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:

networks:
  ascension-sonar-net:
    name: ascension-sonar-net

