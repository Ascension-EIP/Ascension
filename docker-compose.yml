services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ascension-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ascension}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ascension}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ascension-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: ascension-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ascension}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ascension}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ascension-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    build: ./apps/server/postgres
    image: ${IMAGE_PREFIX:-ghcr.io/ascension-eip}/ascension-postgres:latest
    container_name: ascension-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ascension}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ascension}
      POSTGRES_DB: ${POSTGRES_DB:-ascension}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - ascension-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ascension} -d ${POSTGRES_DB:-ascension}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./apps/server
    container_name: ascension-server
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgresql
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=http://minio:${MINIO_PORT:-9000}
    networks:
      - ascension-network
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-worker:
    build: ./apps/ai
    container_name: ascension-ai-worker
    restart: unless-stopped
    profiles:
      - prod
    env_file: .env
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_DB_URL=postgres://${POSTGRES_USER:-ascension}:${POSTGRES_PASSWORD:-ascension}@postgresql:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-ascension}
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=http://minio:${MINIO_PORT:-9000}
    networks:
      - ascension-network
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  sonar-db:
    image: postgres:18-alpine
    container_name: ascension-sonar-db
    restart: unless-stopped
    profiles:
      - sonar
    environment:
      - POSTGRES_USER=${SONAR_DB_USER}
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD}
      - POSTGRES_DB=${SONAR_DB_NAME}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - ascension-sonar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:lts-community
    container_name: ascension-sonarqube
    restart: unless-stopped
    profiles:
      - sonar
    ports:
      - "9005:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME}
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
      - SONAR_SEARCH_JAVAADDITIONALOPTS=-Dcluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - ascension-sonar-net
    depends_on:
      sonar-db:
        condition: service_healthy

volumes:
  minio_data:
  postgres_data:
  rabbitmq_data:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:

networks:
  ascension-network:
    name: ascension-network
  ascension-sonar-net:
    name: ascension-sonar-net

