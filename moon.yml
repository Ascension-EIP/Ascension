tasks:
  setup:
    script: |
      git config core.hooksPath .github/hooks
      git config commit.template .gitmessage
    options:
      outputStyle: "buffer-only-failure"

  update:
    command: "python3"
    args: ["scripts/update_moon.py"]
    options:
      cache: false

  db-up:
    command: "docker"
    args: ["compose", "up", "-d", "postgresql", "minio", "rabbitmq"]
    options:
      cache: false

  db-down:
    command: "docker"
    args: ["compose", "down"]
    options:
      cache: false

  db-clean:
    command: "docker"
    args: ["compose", "down", "-v"]
    options:
      cache: false

  prod-up:
    command: "docker"
    args: ["compose", "--profile", "prod", "up", "-d"]
    options:
      cache: false

  prod-down:
    command: "docker"
    args: ["compose", "--profile", "prod", "down"]
    options:
      cache: false

  format:
    command: "python3"
    args: ["scripts/manage_headers.py"]
    inputs:
      - "**/*.go"
      - "**/*.dart"
      - "**/*.py"
      - "scripts/manage_headers.py"
    options:
      outputStyle: "buffer-only-failure"

  sonar-up:
    command: "docker"
    args: ["compose", "--profile", "sonar", "up", "-d", "sonar-db", "sonarqube"]
    options:
      cache: false

  sonar-down:
    command: "docker"
    args: ["compose", "--profile", "sonar", "rm", "-s", "-f", "sonar-db", "sonarqube"]
    options:
      cache: false

  sonar-clean:
    command: "docker"
    args: ["compose", "--profile", "sonar", "down", "-v"]
    options:
      cache: false

  sonar-setup:
    command: "python3"
    args: ["scripts/setup-sonarqube.py"]
    options:
      cache: false

  sonar-scan:
    command: "npx"
    args:
      - "-y"
      - "sonar-scanner"
      - "-Dsonar.host.url=$SONAR_HOST_URL"
      - "-Dsonar.login=$SONAR_TOKEN"
    options:
      cache: false
      envFile: true
      shell: true

  commit:
    command: "./.github/scripts/gemini_commit"
    options:
      cache: false
      envFile: true
      interactive: true

  stand-up:
    command: "python3"
    args: ["scripts/stand_up.py"]
    options:
      cache: false
      envFile: true
      interactive: true

  schemas-generate:
    script: |
      mkdir -p apps/server/internal/shared apps/new_ai/src/shared
      npx -y quicktype --src-lang schema schemas/*.schema.json \
        -o apps/server/internal/shared/models.go --lang go --just-types-and-package --package shared
      npx -y quicktype --src-lang schema schemas/*.schema.json \
        -o apps/new_ai/src/shared/models.py --lang python --just-types --python-version 3.9 --pydantic-base-model
      sed -i -e 's/^from enum import Enum$/from enum import StrEnum/' -e 's/^class \(\w\+\)(Enum):/class \1(StrEnum):/' apps/new_ai/src/shared/models.py
    inputs:
      - "schemas/*.schema.json"
    outputs:
      - "apps/server/internal/shared/models.go"
      - "apps/new_ai/src/shared/models.py"
