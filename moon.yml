tasks:
  setup:
    script: |
      git config core.hooksPath .github/hooks
      git config commit.template .gitmessage
      go -C apps/server run ./cmd/migrate
    options:
      cache: false
      envFile: true


  db-up:
    command: "docker"
    args: ["compose", "up", "-d", "postgresql", "minio", "rabbitmq"]
    options:
      cache: false

  db-down:
    command: "docker"
    args: ["compose", "down"]
    options:
      cache: false

  db-clean:
    command: "docker"
    args: ["compose", "down", "-v"]
    options:
      cache: false

  prod-up:
    command: "docker"
    args: ["compose", "--profile", "prod", "up", "-d"]
    options:
      cache: false

  prod-down:
    command: "docker"
    args: ["compose", "--profile", "prod", "down"]
    options:
      cache: false

  format:
    command: "python3"
    args: ["scripts/manage_headers.py"]
    inputs:
      - "**/*.go"
      - "**/*.dart"
      - "**/*.py"
      - "scripts/manage_headers.py"

  sonar-up:
    command: "docker"
    args: ["compose", "--profile", "sonar", "up", "-d", "sonar-db", "sonarqube"]
    options:
      cache: false

  sonar-down:
    command: "docker"
    args: ["compose", "--profile", "sonar", "rm", "-s", "-f", "sonar-db", "sonarqube"]
    options:
      cache: false

  sonar-clean:
    command: "docker"
    args: ["compose", "--profile", "sonar", "down", "-v"]
    options:
      cache: false

  sonar-setup:
    command: "python3"
    args: ["scripts/setup-sonarqube.py"]
    options:
      cache: false

  sonar-scan:
    command: "npx"
    args:
      - "-y"
      - "sonar-scanner"
      - "-Dsonar.host.url=$SONAR_HOST_URL"
      - "-Dsonar.login=$SONAR_TOKEN"
    options:
      cache: false
      envFile: true
      shell: true

  commit:
    command: "./.github/scripts/gemini_commit"
    options:
      cache: false
      envFile: true
      interactive: true
