# SonarQube analysis of the Flutter app, run by the Jenkins pipeline (runMobileCI).
sonar.projectKey=ascension-mobile
sonar.projectName=Ascension Mobile
sonar.sourceEncoding=UTF-8

sonar.sources=lib
sonar.exclusions=**/*.g.dart,**/*.freezed.dart
sonar.tests=test

# Written by `flutter test --coverage` in the Tests stage.
sonar.dart.lcov.reportPaths=coverage/lcov.info
