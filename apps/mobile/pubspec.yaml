name: mobile
description: "Ascension — Biomechanical analysis and intelligent climbing tracking app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  image_picker: ^1.2.2
  video_player: ^2.14.0
  http: ^1.2.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  equatable: ^2.0.8
  go_router: ^18.0.2
  just_audio: ^0.10.5
  flutter_markdown: ^0.7.7
  forui: ^0.27.3
  flutter_animate: ^4.5.2
  skeletonizer: ^3.0.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
