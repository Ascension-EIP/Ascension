name: mobile
description: "Ascension — Biomechanical analysis and intelligent climbing tracking app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # UI / Design System
  forui: ^0.26.0
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  google_fonts: ^6.2.1

  # Navigation & Routing
  go_router: ^17.2.2

  # Networking & HTTP
  dio: ^5.8.0+1

  # Local Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5

  # Functional, Serialization & Utils
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  equatable: ^2.0.8
  diacritic: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.4
  custom_lint: ^0.7.5
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  alchemist: ^0.14.0
  widgetbook: ^3.25.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#09090B"
    theme_color: "#09090B"
  linux:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/


