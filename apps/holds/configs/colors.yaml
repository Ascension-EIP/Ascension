# Reference hold colours (pipeline step B3), in the descriptor space of
# `holds.colors.hold_descriptor`:
#   L: 25th percentile of the hold lightness (CIELAB L*, 0-100)
#   a, b: median a*/b* of the 10 % most saturated hold pixels, minus the wall colour cast
# Measured as the median descriptor per colour on the train splits of the Guillaume
# (polygon masks) and eeqyl (ellipses inscribed in boxes) datasets.
# Expect ~83 % correct names in a calibrated gym and ~60 % in an unseen one.
lightness_weight: 0.5
colors:
  black: [17.5, -0.2, -0.4]
  blue: [30.5, 3.6, -30.6]
  brown: [41.0, 5.9, 20.8]
  cream: [40.6, 1.8, 9.3]
  green: [34.8, -25.5, 21.1]
  orange: [33.0, 36.7, 26.3]
  pink: [37.2, 46.5, -5.0]
  purple: [24.5, 11.1, -15.8]
  red: [41.5, 32.3, 12.2]
  white: [51.0, -1.4, 11.1]
  yellow: [54.7, -3.2, 59.7]
