$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'dart'

project:
  name: 'new_mobile'
  description: 'Clean Flutter mobile app for Ascension (Feature-First architecture)'

tasks:
  install:
    command: 'flutter'
    args: ['pub', 'get']
    inputs:
      - 'pubspec.yaml'
      - 'pubspec.lock'

  update:
    command: 'flutter'
    args: ['pub', 'upgrade']
    options:
      cache: false

  format:
    command: 'dart'
    args: ['format', '.']
    inputs:
      - 'lib/**/*'
      - 'test/**/*'
      - 'assets/**/*'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
    deps:
      - 'install'
      - 'root:format'

  lint:
    command: 'flutter'
    args: ['analyze']
    inputs:
      - 'lib/**/*'
      - 'test/**/*'
      - 'assets/**/*'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
    deps:
      - 'install'

  build-runner:
    command: 'dart'
    args: ['run', 'build_runner', 'build', '--delete-conflicting-outputs']
    inputs:
      - 'lib/**/*'
      - 'pubspec.yaml'
    deps:
      - 'install'

  build-android:
    command: 'flutter'
    args: ['build', 'apk', '--dart-define=BACKEND_URL=${BACKEND_URL}']
    inputs:
      - 'lib/**/*'
      - 'assets/**/*'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**/*'
    outputs:
      - 'build/app/outputs/flutter-apk'
    options:
      envFile: true
    deps:
      - 'lint'

  build-ios:
    command: 'flutter'
    args: ['build', 'ios', '--no-codesign', '--dart-define=BACKEND_URL=${BACKEND_URL}']
    inputs:
      - 'lib/**/*'
      - 'assets/**/*'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**/*'
    outputs:
      - 'build/ios/iphoneos'
    options:
      envFile: true
    deps:
      - 'lint'

  test:
    command: 'flutter'
    args: ['test']
    inputs:
      - 'lib/**/*'
      - 'test/**/*'
      - 'assets/**/*'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
    deps:
      - 'install'

  dev:
    command: 'flutter'
    args: ['run', '--dart-define=BACKEND_URL=${BACKEND_URL}']
    options:
      persistent: true
      cache: false
      envFile: true
    deps:
      - 'install'

  clean:
    command: 'flutter'
    args: ['clean']
    options:
      cache: false
