language: "go"

project:
  name: "server"
  description: "Go/Gin backend server for Ascension"

tasks:
  setup:
    command: "go"
    args: ["install", "-tags", "postgres", "github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1"]
    options:
      cache: false

  install:
    command: "go"
    args: ["mod", "download"]
    inputs:
      - "go.mod"
      - "go.sum"

  update:
    script: |
      go get -u ./...
      go mod tidy
    options:
      cache: false

  migrate:
    script: |
      export PATH="$(go env GOPATH)/bin:$PATH"
      migrate -path internal/outbound/postgres/migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=disable" up
    options:
      cache: false
      envFile: true
  
  format:
    command: "go"
    args: ["fmt", "./..."]
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    deps:
      - "install"
      - "root:format"

  lint:
    command: "go"
    args: ["vet", "./..."]
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    deps:
      - "format"

  build:
    command: "go"
    args: ["build", "-o", "bin/server", "./cmd/server"]
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    outputs:
      - "bin/server"
    deps:
      - "lint"

  test:
    command: "go"
    args: ["test", "./..."]
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/outbound/postgres/migrations/**/*"
    deps:
      - "install"

  dev:
    command: "go"
    args: ["run", "./cmd/server"]
    env:
      LOG_LEVEL: "debug"
    options:
      persistent: true
      cache: false
      envFile: true
    deps:
      - "install"
      - "root:schemas-generate"

  clean:
    command: "rm"
    args: ["-rf", "bin"]
    options:
      cache: false
