language: "go"

project:
  name: "server"
  description: "Go/Gin backend server for Ascension"

tasks:
  install:
    command: "go"
    args: ["mod", "download"]
    inputs:
      - "go.mod"
      - "go.sum"
    deps:
      - "root:setup-git-config"

  
  format:
    command: "go"
    args: ["fmt", "./..."]
    inputs:
      - "cmd/**/*"
      - "internal/**/*"
      - "go.mod"
      - "go.sum"
    deps:
      - "install"

  lint:
    command: "go"
    args: ["vet", "./..."]
    inputs:
      - "cmd/**/*"
      - "internal/**/*"
      - "go.mod"
      - "go.sum"
    deps:
      - "format"

  build:
    command: "go"
    args: ["build", "-o", "bin/server", "./cmd/server"]
    inputs:
      - "cmd/**/*"
      - "internal/**/*"
      - "go.mod"
      - "go.sum"
    deps:
      - "lint"

  build-release:
    command: "go"
    args: ["build", "-ldflags", "-s -w", "-o", "bin/server", "./cmd/server"]
    inputs:
      - "cmd/**/*"
      - "internal/**/*"
      - "go.mod"
      - "go.sum"
    deps:
      - "lint"

  test:
    command: "go"
    args: ["test", "./..."]
    inputs:
      - "cmd/**/*"
      - "internal/**/*"
      - "go.mod"
      - "go.sum"
    deps:
      - "install"

  dev:
    command: "go"
    args: ["run", "./cmd/server"]
    env:
      LOG_LEVEL: "debug"
    options:
      envFile: true
    deps:
      - "install"
