language: "go"

project:
  name: "server"
  description: "Go/Gin backend server for Ascension"

tasks:
  install:
    command: "go"
    args: ["mod", "download"]
    inputs:
      - "go.mod"
      - "go.sum"
    deps:
      - "root:setup"

  update:
    script: |
      go get -u ./...
      go mod tidy
    options:
      cache: false
  
  format:
    command: "go"
    args: ["fmt", "./..."]
    inputs:
      - "cmd/**/*"
      - "internal/**/*"
      - "go.mod"
      - "go.sum"
    deps:
      - "install"
      - "root:format"

  lint:
    command: "go"
    args: ["vet", "./..."]
    inputs:
      - "cmd/**/*"
      - "internal/**/*"
      - "go.mod"
      - "go.sum"
    deps:
      - "format"

  build:
    command: "go"
    args: ["build", "-o", "bin/server", "./cmd/server"]
    inputs:
      - "cmd/**/*"
      - "internal/**/*"
      - "go.mod"
      - "go.sum"
    outputs:
      - "bin/server"
    deps:
      - "lint"

  test:
    command: "go"
    args: ["test", "./..."]
    inputs:
      - "cmd/**/*"
      - "internal/**/*"
      - "go.mod"
      - "go.sum"
    deps:
      - "install"

  dev:
    command: "go"
    args: ["run", "./cmd/server"]
    env:
      LOG_LEVEL: "debug"
    options:
      persistent: true
      cache: false
      envFile: true
    deps:
      - "install"

  clean:
    command: "rm"
    args: ["-rf", "bin"]
    options:
      cache: false
