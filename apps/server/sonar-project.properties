# SonarQube analysis of the Go API, run by the Jenkins pipeline (runServerCI).
sonar.projectKey=ascension-server
sonar.projectName=Ascension Server
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=**/*_test.go,internal/testutil/**,bin/**,dist/**,internal/shared/models.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Written by `go test -coverpkg=./... -coverprofile` in the Tests stage.
sonar.go.coverage.reportPaths=coverage.out
# Startup code, still analysed but left out of the coverage: it connects to the real
# PostgreSQL, S3 and RabbitMQ, exits the process on failure and runs until a signal,
# so unit tests cannot run it. Everything it wires is tested on its own.
sonar.coverage.exclusions=cmd/**,internal/app/**
