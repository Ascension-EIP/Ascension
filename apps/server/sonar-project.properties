# SonarQube analysis of the Go API, run by the Jenkins pipeline (runServerCI).
sonar.projectKey=ascension-server
sonar.projectName=Ascension Server
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=**/*_test.go,bin/**,dist/**,internal/shared/models.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Written by `go test -coverprofile` in the Tests stage.
sonar.go.coverage.reportPaths=coverage.out
