[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gianni TUERO", email = "gianni.tuero@epitech.eu" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.122",
    "dotenv>=0.9.9",
    "mediapipe>=0.10.35,<1.0.0",
    "numpy>=2.4.6",
    "openai>=3.41.0",
    "opencv-contrib-python>=4.8.0",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "ruff>=0.17.3",
]

[project.scripts]
worker = "worker:main"

[tool.uv.build-backend]
module-name = ["worker", "common", "services", "shared"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
# Generated by `moon run root:schemas-generate`: never reformatted or fixed by ruff.
extend-exclude = ["src/shared/models.py"]

[tool.coverage.run]
# Generated by `moon run root:schemas-generate`.
omit = ["src/shared/models.py"]
# Count the code run by the functional tests in `worker` sub-processes.
parallel = true
patch = ["subprocess"]
