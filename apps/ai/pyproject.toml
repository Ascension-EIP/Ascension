[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gianni TUERO", email = "gianni.tuero@epitech.eu" }
]
requires-python = ">=3.11"
dependencies = [
    "cv>=1.0.0",
    "dotenv>=0.9.9",
    "mediapipe>=1.2.0,<2.0.0",
    "minio>=7.2.20",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "ruff>=0.17.3",
]

[project.scripts]
worker = "worker:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
