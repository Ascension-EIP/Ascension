$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'python'

project:
  name: 'ai'
  description: 'AI service for Ascension'

tasks:
  setup:
    command: 'uv'
    args: ['sync']
    inputs:
      - 'pyproject.toml'
      - 'uv.lock'
    deps:
      - 'root:setup-git-config'

  download-model:
    command: 'bash'
    args: ['scripts/download-model.sh']
    outputs:
      - 'pose_landmarker.task'

  dev:
    command: 'uv'
    args: ['run', 'python', '-u', 'src/worker.py']
    deps:
      - 'setup'
      - 'download-model'
    env:
      LOG_LEVEL: 'debug'
      PYTHONUNBUFFERED: '1'
    options:
      envFile: true

  build:
    command: 'uv'
    args: ['build']
    deps:
      - 'setup'

  lint:
    command: 'uv'
    args: ['run', 'ruff', 'check', 'src']
    deps:
      - 'setup'

  test:
    command: 'uv'
    args: ['run', 'pytest', '-p', 'no:cacheprovider']
    deps:
      - 'setup'
    options:
      allowFailure: true

  format:
    command: 'uv'
    args: ['run', 'ruff', 'check', '--fix', 'src']
    deps:
      - 'setup'


