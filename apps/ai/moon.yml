$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'python'

project:
  name: 'ai'
  description: 'AI service for Ascension'

tasks:
  setup:
    command: 'bash'
    args: ['scripts/download-model.sh']
    inputs:
      - 'scripts/download-model.sh'
    outputs:
      - 'resources/pose_landmarker_full.task'

  install:
    command: 'uv'
    args: ['sync']
    inputs:
      - 'pyproject.toml'
      - 'uv.lock'

  update:
    command: 'uv'
    args: ['sync', '--upgrade']
    options:
      cache: false

  format:
    command: 'uv'
    args: ['run', 'ruff', 'check', '--fix', 'src', 'tests']
    inputs:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
    deps:
      - 'install'
      - 'root:format'

  lint:
    command: 'uv'
    args: ['run', 'ruff', 'check', 'src', 'tests']
    inputs:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
    deps:
      - 'format'
      - 'root:schemas-generate'

  build:
    command: 'uv'
    args: ['build']
    inputs:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
    outputs:
      - 'dist'
    deps:
      - 'lint'
      - 'root:schemas-generate'

  # Unit and functional tests: no infrastructure, no network.
  test:
    command: 'uv'
    args: ['run', 'pytest', '-p', 'no:cacheprovider', '-m', 'not e2e and not integration']
    inputs:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
    deps:
      - 'install'
      - 'setup'
      - 'root:schemas-generate'

  # Coverage of src/ (generated shared/models.py excluded). No infrastructure.
  coverage:
    command: 'uv'
    args:
      - 'run'
      - 'pytest'
      - '-p'
      - 'no:cacheprovider'
      - '-m'
      - 'not e2e and not integration'
      - '--cov=src'
      - '--cov-report=term-missing'
      - '--cov-report=xml:coverage.xml'
    inputs:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
    outputs:
      - 'coverage.xml'
    options:
      cache: false
    deps:
      - 'install'
      - 'setup'
      - 'root:schemas-generate'

  # Real RabbitMQ, PostgreSQL and RustFS (LLM faked). Also runs the PostgreSQL integration tests.
  # Reads the usual POSTGRES_*, RABBITMQ_* and RUSTFS_* variables; TEST_POSTGRES_URL overrides the database URL.
  # Skipped (not failed) when a service is unreachable: read the skip reasons.
  e2e:
    command: 'uv'
    args: ['run', 'pytest', '-p', 'no:cacheprovider', '-rs', '-m', 'e2e or integration']
    options:
      cache: false
      envFile: true
    deps:
      - 'install'
      - 'setup'
      - 'root:schemas-generate'
      - 'root:db-up'
      - 'server:migrate'

  dev:
    command: 'uv'
    args: ['run', 'worker']
    env:
      LOG_LEVEL: 'debug'
      PYTHONUNBUFFERED: '1'
    options:
      persistent: true
      cache: false
      envFile: true
    deps:
      - 'install'
      - 'root:schemas-generate'

  producer:
    command: 'uv'
    args: ['run', 'python', 'src/producer.py']
    env:
      PYTHONUNBUFFERED: '1'
    options:
      cache: false
      envFile: true
    deps:
      - 'install'

  # Usage: moon run ai:pose-detect -- --video resources/example-2.mp4 --out /tmp/result.json
  pose-detect:
    command: 'uv'
    args: ['run', 'worker', 'pose-detect']
    options:
      cache: false
    deps:
      - 'install'
      - 'root:schemas-generate'

  clean:
    script: |
      rm -rf .venv .ruff_cache .pytest_cache coverage.xml
      find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
    options:
      cache: false
