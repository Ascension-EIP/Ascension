$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'python'

project:
  name: 'ai'
  description: 'AI service for Ascension'

tasks:
  install:
    command: 'uv'
    args: ['sync']
    inputs:
      - 'pyproject.toml'
      - 'uv.lock'
    deps:
      - 'root:setup'

  download-model:
    command: 'bash'
    args: ['scripts/download-model.sh']
    inputs:
      - 'scripts/download-model.sh'
    outputs:
      - 'pose_landmarker.task'

  format:
    command: 'uv'
    args: ['run', 'ruff', 'check', '--fix', 'src']
    inputs:
      - 'src/**/*'
      - 'pyproject.toml'
      - 'uv.lock'
    deps:
      - 'install'

  lint:
    command: 'uv'
    args: ['run', 'ruff', 'check', 'src']
    inputs:
      - 'src/**/*'
      - 'pyproject.toml'
      - 'uv.lock'
    deps:
      - 'format'

  build:
    command: 'uv'
    args: ['build']
    inputs:
      - 'src/**/*'
      - 'pyproject.toml'
      - 'uv.lock'
    outputs:
      - 'dist'
    deps:
      - 'lint'

  test:
    command: 'uv'
    args: ['run', 'pytest', '-p', 'no:cacheprovider']
    inputs:
      - 'src/**/*'
      - 'pyproject.toml'
      - 'uv.lock'
    options:
      allowFailure: true
    deps:
      - 'install'

  dev:
    command: 'uv'
    args: ['run', 'python', '-u', 'src/worker.py']
    env:
      LOG_LEVEL: 'debug'
      PYTHONUNBUFFERED: '1'
    options:
      persistent: true
      cache: false
      envFile: true
    deps:
      - 'install'
