# SonarQube analysis of the Python AI worker, run by the Jenkins pipeline (runAiCI).
sonar.projectKey=ascension-ai
sonar.projectName=Ascension AI
sonar.sourceEncoding=UTF-8

sonar.sources=src
# Generated by `moon run root:schemas-generate`.
sonar.exclusions=src/shared/models.py
sonar.tests=tests
sonar.python.version=3.11

# Written by pytest in the Tests stage.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
